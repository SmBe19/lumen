<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Lumen lighthouse">
  <defs>
    <radialGradient id="glow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#fff6c2" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#fff6c2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- light glow -->
  <circle cx="32" cy="19" r="26" fill="url(#glow)"/>

  <!-- beams of light -->
  <polygon points="32,17 1,6 1,28" fill="#ffe066" opacity="0.9"/>
  <polygon points="32,17 63,6 63,28" fill="#ffe066" opacity="0.9"/>

  <!-- tower -->
  <polygon points="27,22 37,22 42,55 22,55"
           fill="#eef2f6" stroke="#37474f" stroke-width="1.6" stroke-linejoin="round"/>

  <!-- stripes -->
  <polygon points="26.1,28 37.9,28 38.8,33.5 25.2,33.5" fill="#c0392b"/>
  <polygon points="24.4,41 39.6,41 40.5,46.5 23.5,46.5" fill="#c0392b"/>

  <!-- lantern room -->
  <rect x="26" y="13" width="12" height="9" fill="#ffd400"
        stroke="#37474f" stroke-width="1.6"/>

  <!-- roof -->
  <polygon points="24.5,13 39.5,13 32,5.5" fill="#37474f"/>

  <!-- base / ground -->
  <rect x="17" y="54.5" width="30" height="3.5" rx="0.5" fill="#37474f"/>
</svg>
