{% extends "base.html" %}
{% block title %}{{ t('index.title') }}{% endblock %}
{% block content %}
<div class="center-card">
  <h1>{{ t('index.heading') }}</h1>
  <div class="step">
    <h2>{{ t('index.join_heading') }}</h2>
    <p>{{ t('index.join_hint') }}</p>
    <form method="post" action="{{ url_for('public.join') }}">
      <div class="field">
        <label for="exam_key">{{ t('index.exam_key') }}</label>
        <input id="exam_key" name="exam_key" type="text" autocomplete="off" required autofocus>
      </div>
      <button class="primary" type="submit">{{ t('index.join_button') }}</button>
    </form>
  </div>
</div>
{% endblock %}
