[project]
name = "lumen"
version = "0.1.0"
description = "Screen monitoring for exams"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
]

[project.scripts]
lumen = "lumen.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lumen"]

[tool.uv]
package = true
